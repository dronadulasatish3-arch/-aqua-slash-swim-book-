<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Aqua Slash Swim Book — Primary Student Swimming Platform, Curriculum, 3D Journey and Educational Swim Library." />
    <title>Aqua Slash – Swim Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var APP_BUILD_ID = '2026-11-24-v3.2';
        try {
          var lastBuild = localStorage.getItem('AQUA_SLASH_APP_BUILD');
          if (lastBuild && lastBuild !== APP_BUILD_ID) {
            localStorage.setItem('AQUA_SLASH_APP_BUILD', APP_BUILD_ID);
            localStorage.removeItem('aquaslash-registered-students-v1');
            localStorage.removeItem('aquaslash-registered-students-v2');
          } else if (!lastBuild) {
            localStorage.setItem('AQUA_SLASH_APP_BUILD', APP_BUILD_ID);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
